name: JaviPiV2 checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: bash -n installer/bootstrap.sh
      - run: python3 -m unittest discover -s tests -v
      - run: bash installer/bootstrap.sh --plan minimal
      - run: bash installer/bootstrap.sh --plan developer
      - run: bash installer/bootstrap.sh --plan full
